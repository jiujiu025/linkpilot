name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
      # 项目没有构建步骤，直接跑类型检查与用例
      - run: npm install
      - run: npm run typecheck
      - run: npm test
